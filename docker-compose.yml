version: '3.8'

services:
  # Service MySQL
  mysql:
    image: mysql:8.0
    container_name: myauxilium_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: myauxilium
      MYSQL_USER: myauxilium_user
      MYSQL_PASSWORD: myauxilium_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - myauxilium_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Service Backend FastAPI
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myauxilium_backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - myauxilium_network
    volumes:
      - .:/app
    working_dir: /app

volumes:
  mysql_data:
    driver: local

networks:
  myauxilium_network:
    driver: bridge 