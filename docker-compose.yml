version: '3.8'

services:
  # Service MySQL
  mysql:
    image: mysql:8.0
    container_name: vela_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 12345678
      MYSQL_DATABASE: vela_db
      MYSQL_USER: vela_user
      MYSQL_PASSWORD: 12345678
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - vela_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 30s
      retries: 15
      interval: 10s
      start_period: 60s

  # Service Backend FastAPI
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vela_backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Host .env uses 127.0.0.1:3307 for local runs; inside Compose use the service name and internal port.
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
    networks:
      - vela_network
    volumes:
      - .:/app
    working_dir: /app
    env_file:
      - .env

volumes:
  mysql_data:
    driver: local

networks:
  vela_network:
    driver: bridge 